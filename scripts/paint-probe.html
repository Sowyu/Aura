<!doctype html><html><head><meta charset="utf-8"><title>Aura paint probe</title>
<style>body{font:40px/1.3 -apple-system,Helvetica;margin:24px;background:#fff}#t{font-size:120px;font-weight:700}#k{color:#c00}.ad{height:60px;background:#0a0;color:#fff;font-size:24px}</style></head>
<body>
<div>secs since load: <span id="t">0</span></div>
<div>rAF frames: <span id="f">0</span></div>
<div>keepAlive global: <span id="k">?</span></div>
<div>ad script blocked: <span id="ad">?</span></div>
<div>fetch to pagead2 blocked: <span id="fx">?</span></div>
<script>
var t0=Date.now(),f=0;
setInterval(function(){document.getElementById('t').textContent=Math.round((Date.now()-t0)/1000)},250);
(function loop(){f++;document.getElementById('f').textContent=f;requestAnimationFrame(loop)})();
document.getElementById('k').textContent=(document.documentElement.__auraKeepAlive===true)?'PRESENT':'absent';
var s=document.createElement('script');s.src='https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js';
s.onload=function(){document.getElementById('ad').textContent='NOT blocked (loaded)'};
s.onerror=function(){document.getElementById('ad').textContent='blocked (error)'};
document.head.appendChild(s);
fetch('https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js',{mode:'no-cors'}).then(function(){document.getElementById('fx').textContent='NOT blocked'}).catch(function(){document.getElementById('fx').textContent='blocked'});

var fx='?';fetch('https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js',{mode:'no-cors',cache:'no-store'}).then(function(){fx='NOTblocked'}).catch(function(){fx='blocked'});
setInterval(function(){var k=(document.documentElement.__auraKeepAlive===true)?'present':'absent';document.getElementById('k').textContent=k;try{fetch('/beacon?run='+encodeURIComponent(location.search)+'&t='+Math.round((Date.now()-t0)/1000)+'&f='+f+'&k='+k+'&vis='+document.visibilityState+'&ad='+encodeURIComponent(document.getElementById('ad').textContent)+'&fx='+fx,{cache:'no-store'})}catch(e){}},2000);
</script></body></html>
