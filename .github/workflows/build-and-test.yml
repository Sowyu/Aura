name: Build and test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    runs-on: macos-latest
    
    steps:
    - name: Check architecture
      run: uname -m
      
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        # Pinned, not latest-stable: the project tracks one SDK.
        xcode-version: '26.0'
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Show Swift version
      run: swift --version

    - name: Install Xcodegen
      run: brew install xcodegen

    - name: Generate Xcode project
      run: xcodegen

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      run: swiftlint lint

    - name: Install SwiftFormat
      run: brew install swiftformat

    - name: Check code formatting
      run: swiftformat --lint .

    - name: Install Xcbeautify
      run: brew install xcbeautify

    - name: Clean build folder
      run: xcodebuild clean -scheme aura -project Aura.xcodeproj
    
    - name: Cache SPM dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm/
          ~/.swiftpm/
        key: ${{ runner.os }}-spm-${{ hashFiles('**/Package.swift') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Resolve dependencies
      run: xcodebuild -resolvePackageDependencies

    - name: Build for testing
      run: |
        set -o pipefail
        xcodebuild build-for-testing -project Aura.xcodeproj -scheme aura \
          -destination "platform=macOS" -configuration Debug \
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= | xcbeautify

    - name: Unit tests
      run: |
        set -o pipefail
        xcodebuild test-without-building -project Aura.xcodeproj -scheme aura \
          -destination "platform=macOS" -derivedDataPath DerivedData \
          -only-testing:auraTests CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= | xcbeautify
