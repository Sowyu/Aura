name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      launch-baseline:
        description: 'Optional commit to compare Release launch times against on the same Mac'
        required: false
        type: string

jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - run: bash scripts/check-local.sh

  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 35
    
    steps:
    - name: Check architecture
      run: uname -m
      
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        # Pinned, not latest-stable: the project tracks one SDK.
        xcode-version: '26.0'
    
    - name: Show Xcode version
      run: xcodebuild -version
    
    - name: Show Swift version
      run: swift --version

    - name: Install build tools
      run: brew install xcodegen trash-cli

    - name: Generate Xcode project
      run: xcodegen

    - name: Install SwiftLint
      run: brew install swiftlint

    - name: Run SwiftLint
      id: lint
      continue-on-error: true
      run: swiftlint lint

    - name: Install SwiftFormat
      run: brew install swiftformat

    - name: Check code formatting
      id: format
      continue-on-error: true
      run: swiftformat --lint .

    - name: Install Xcbeautify
      run: brew install xcbeautify

    - name: Cache SPM dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/org.swift.swiftpm/
          ~/.swiftpm/
        key: ${{ runner.os }}-spm-${{ hashFiles('project.yml', '**/Package.resolved') }}
        restore-keys: |
          ${{ runner.os }}-spm-
    
    - name: Resolve dependencies
      run: xcodebuild -resolvePackageDependencies

    - name: Build for testing
      run: |
        set -o pipefail
        xcodebuild build-for-testing -project Aura.xcodeproj -scheme aura \
          -destination "platform=macOS" -configuration Debug \
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= | tee build.log | xcbeautify

    - name: Unit tests
      id: tests
      continue-on-error: true
      run: |
        set -o pipefail
        xcodebuild test-without-building -project Aura.xcodeproj -scheme aura \
          -destination "platform=macOS" -derivedDataPath DerivedData \
          -resultBundlePath TestResults.xcresult \
          -only-testing:auraTests CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= | tee tests.log | xcbeautify

    - name: Injected WebKit bundle tests
      id: webbundle
      continue-on-error: true
      run: |
        set -o pipefail
        TEST_RUNNER_AURA_BUNDLE=1 xcodebuild test-without-building \
          -project Aura.xcodeproj -scheme aura -destination "platform=macOS" \
          -derivedDataPath DerivedData -resultBundlePath WebBundleResults.xcresult \
          -only-testing:auraTests/WebBundleTests -only-testing:auraTests/WebRequestBrokerTests \
          -only-testing:auraTests/BrowserPageTests \
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= | tee webbundle.log | xcbeautify

    - name: Upload native test logs
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: macos-test-logs
        path: |
          build.log
          tests.log
          webbundle.log
        if-no-files-found: ignore
        retention-days: 7

    - name: Build Release
      if: ${{ steps.tests.outcome == 'success' && steps.webbundle.outcome == 'success' }}
      run: |
        set -o pipefail
        xcodebuild build -project Aura.xcodeproj -scheme aura \
          -destination "platform=macOS" -configuration Release \
          -derivedDataPath DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= | tee release.log | xcbeautify

    - name: Capture formatter fixes
      if: ${{ !cancelled() && steps.format.outcome == 'failure' }}
      run: |
        swiftformat .
        git diff > format.patch

    - name: Upload validation results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: macos-validation
        path: |
          *.log
          *.xcresult
          format.patch
          ~/Library/Logs/DiagnosticReports/Aura*
        if-no-files-found: ignore
        retention-days: 7

    - name: Require all validation checks
      if: ${{ !cancelled() && (steps.lint.outcome == 'failure' || steps.format.outcome == 'failure' || steps.tests.outcome == 'failure' || steps.webbundle.outcome == 'failure') }}
      run: exit 1

  launch-benchmark:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '26.0'
    - name: Install build tools
      run: brew install xcodegen trash-cli xcbeautify
    - name: Record hardware and software
      run: |
        { system_profiler SPHardwareDataType; sw_vers; xcodebuild -version; git rev-parse HEAD; } | tee launch-environment.log
    - name: Compare Release launches
      env:
        LAUNCH_BASELINE: ${{ inputs.launch-baseline }}
      run: |
        set -euo pipefail
        if [[ -n "$LAUNCH_BASELINE" ]]; then
          BASELINE_COMMIT=$(git rev-parse --verify "${LAUNCH_BASELINE}^{commit}")
          BASELINE_DIR="$RUNNER_TEMP/aura-launch-baseline"
          git worktree add --detach "$BASELINE_DIR" "$BASELINE_COMMIT"
          # Use the identical test and project configuration for both app revisions.
          cp project.yml "$BASELINE_DIR/project.yml"
          cp auraUITests/auraUITestsLaunchTests.swift "$BASELINE_DIR/auraUITests/auraUITestsLaunchTests.swift"
          (cd "$BASELINE_DIR" && xcodegen)
          xcodebuild test -project "$BASELINE_DIR/Aura.xcodeproj" -scheme AuraLaunch \
            -configuration Release -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/aura-launch-before" \
            -resultBundlePath "$GITHUB_WORKSPACE/LaunchBefore.xcresult" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= | tee launch-before.log | xcbeautify
        fi
        xcodegen
        xcodebuild test -project Aura.xcodeproj -scheme AuraLaunch \
          -configuration Release -destination "platform=macOS" \
          -derivedDataPath "$RUNNER_TEMP/aura-launch-after" \
          -resultBundlePath "$GITHUB_WORKSPACE/LaunchAfter.xcresult" \
          CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY= | tee launch-after.log | xcbeautify
    - name: Upload launch measurements
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: macos-launch-measurements
        path: |
          launch-*.log
          Launch*.xcresult
        retention-days: 7
