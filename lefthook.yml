pre-commit:
  parallel: false
  commands:
    swiftformat:
      glob: "**/*.swift"
      run: swiftformat {staged_files} --quiet
      stage_fixed: true
    swiftlintfix:
      glob: "**/*.swift"
      run: swiftlint lint --fix --use-alternative-excluding {staged_files}
      stage_fixed: true
    swiftlint:
      glob: "**/*.swift"
      run: swiftlint lint --use-alternative-excluding {staged_files}

pre-push:
  commands:
    no-prompt-docs:
      run: scripts/check-no-prompt-docs.sh $(git ls-tree -r --name-only HEAD -- '*.md' '*.MD')
    test:
      run: ./scripts/xctest-debug.sh
