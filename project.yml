name: Aura
options:
  bundleIdPrefix: com.aurabrowser

packages:
  PublicSuffixList:
    url: https://github.com/ameshkov/swift-psl
    from: 1.1.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  Inject:
    url: https://github.com/krzysztofzablocki/Inject
    from: 1.5.2
  FaviconFinder:
    url: https://github.com/will-lumley/FavIconFinder
    exactVersion: 5.1.5

targets:
  aura:
    type: application
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: aura
        excludes:
          - "Assets/Icons/**"
      # Shared verbatim with the injected bundle so both ends agree on the
      # message names carried over the injected-bundle channel.
      - path: auraWebBundle/AuraResourceTypes.h
      - path: auraWebBundle/AuraResourceTypes.m
      # Rendered by the About section. Listed here, not under a `resources:` key:
      # xcodegen has no such key on a target and silently dropped the file, so the
      # About page reported the notices missing in every build.
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: Sparkle
      - package: PublicSuffixList
      - package: Inject
      - package: FaviconFinder
      - target: AuraWebBundle
        embed: true
        codeSign: true
        copy:
          destination: plugins

    preBuildScripts:
      - name: "Copy Icon Bundle"
        inputFiles:
          - "$(SRCROOT)/aura/Assets/Icons/AuraIcon.icon"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(PRODUCT_NAME).app/Contents/Resources/AuraIcon.icon"
        script: |
          # One icon for every configuration. A stale copy is removed first: cp -R
          # merges into an existing folder and would keep layers that no longer exist.
          ICON_SRC="$SRCROOT/aura/Assets/Icons/AuraIcon.icon"
          ICON_DST="$BUILT_PRODUCTS_DIR/$PRODUCT_NAME.app/Contents/Resources/"
          rm -rf "$ICON_DST/AuraIcon.icon" "$ICON_DST/AuraIconDev.icon"
          cp -R "$ICON_SRC" "$ICON_DST"

    info:
      path: aura/Info/Info.plist
      properties:
        SUFeedURL: "https://github.com/Sowyu/Aura/releases/latest/download/appcast.xml"
        SUPublicEDKey: "6WPPsMkLZ3F4oa4a4IInG2gwUktIrhKAjWhhHv67e5Q="
        SUEnableAutomaticChecks: YES
        SUEnableInstallerLauncherService: YES
        CFBundleURLTypes:
          - CFBundleURLName: Aura Browser
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            CFBundleURLSchemes:
              - http
              - https
        CFBundleDocumentTypes:
          - CFBundleTypeName: Web URL
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.url
          - CFBundleTypeName: HTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.html
          - CFBundleTypeName: XHTML document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Default
            LSItemContentTypes:
              - public.xhtml
          # Local files Aura can draw in a tab. Alternate rank on purpose: opening a PDF
          # or a PNG should stay with Preview until the user says otherwise, and Aura only
          # has to appear in "Open With". `public.html` is declared above and covers .htm
          # as well, so it is not repeated here.
          - CFBundleTypeName: PDF document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - com.adobe.pdf
          - CFBundleTypeName: Text document
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - net.daringfireball.markdown
          - CFBundleTypeName: Image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.png
              - public.jpeg
              - com.compuserve.gif
              - org.webmproject.webp
              - public.svg-image
        NSUserActivityTypes:
          - NSUserActivityTypeBrowsingWeb
        LSMinimumSystemVersion: "15.0"
        LSApplicationCategoryType: public.app-category.web-browser
        NSCameraUsageDescription: "Websites you allow can use your camera for video calls and photos."
        NSMicrophoneUsageDescription: "Websites you allow can use your microphone for calls and voice input."

    entitlements:
      path: aura/Info/aura.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.assets.movies.read-only: true
        com.apple.security.assets.music.read-only: true
        com.apple.security.assets.pictures.read-only: true
        com.apple.security.cs.allow-jit: true
        com.apple.security.device.audio-input: true
        com.apple.security.device.camera: true
        com.apple.security.files.downloads.read-write: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.print: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - "$(PRODUCT_BUNDLE_IDENTIFIER)-spks"
          - "$(PRODUCT_BUNDLE_IDENTIFIER)-spki"

    settings:
      base:
        SWIFT_VERSION: 5.9
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 1.0.1
        CURRENT_PROJECT_VERSION: 109
        PRODUCT_NAME: Aura
        PRODUCT_BUNDLE_IDENTIFIER: com.aurabrowser.app
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_OBJC_BRIDGING_HEADER: aura/Core/BrowserEngine/AuraWebBundleSupport.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/auraWebBundle"
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUFeedURL: "https://github.com/Sowyu/Aura/releases/latest/download/appcast.xml"
        SUPublicEDKey: "6WPPsMkLZ3F4oa4a4IInG2gwUktIrhKAjWhhHv67e5Q="
        SUEnableAutomaticChecks: YES
        SUEnableInstallerLauncherService: YES
      configs:
        Debug:
          ASSETCATALOG_COMPILER_APPICON_NAME: AuraIcon
          CODE_SIGN_ENTITLEMENTS: aura/Info/aura.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          EMIT_FRONTEND_COMMAND_LINES: YES
          OTHER_LDFLAGS: "-Xlinker -interposable"
          ENABLE_HARDENED_RUNTIME: NO
          DEVELOPMENT_TEAM: 8Q677AYRU7
          PROVISIONING_PROFILE_SPECIFIER: ""
        Release:
          ASSETCATALOG_COMPILER_APPICON_NAME: AuraIcon
          CODE_SIGN_ENTITLEMENTS: aura/Info/aura.entitlements
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 8Q677AYRU7
          PROVISIONING_PROFILE_SPECIFIER: ""
          ENABLE_HARDENED_RUNTIME: YES

  AuraWebBundle:
    type: bundle
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: auraWebBundle
    settings:
      base:
        PRODUCT_NAME: AuraWebBundle
        PRODUCT_BUNDLE_IDENTIFIER: com.aurabrowser.app.webbundle
        WRAPPER_EXTENSION: wkbundle
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: mh_bundle
        SKIP_INSTALL: YES
        # WKBundleInitialize is looked up with dlsym, so it must stay exported.
        GCC_SYMBOLS_PRIVATE_EXTERN: NO
        # No entitlements: this loads into WebKit's WebContent process, not Aura.
        CODE_SIGN_ENTITLEMENTS: ""
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
        PROVISIONING_PROFILE_SPECIFIER: ""
        OTHER_LDFLAGS: "-framework WebKit"

  auraTests:
    type: bundle.unit-test
    platform: "macOS"
    deploymentTarget: "15.0"
    sources:
      - path: auraTests
    dependencies:
      - target: aura
    settings:
      base:
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Aura.app/Contents/MacOS/Aura"
        BUNDLE_LOADER: "$(TEST_HOST)"
        SWIFT_OBJC_BRIDGING_HEADER: aura/Core/BrowserEngine/AuraWebBundleSupport.h
        HEADER_SEARCH_PATHS: "$(SRCROOT)/auraWebBundle"

schemes:
  aura:
    shared: true
    build:
      targets:
        aura: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - auraTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
